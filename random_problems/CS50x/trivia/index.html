<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            // TODO: Add code to check answers to questions
        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <!-- TODO: Add multiple choice question here -->
                <h3>Who is the first programmer?</h3>
                <div id="message"></div>
                <button class="btn" id="btn1">Ada Lovelace</button>
                <button class="btn" id="btn2">Elon Musk</button>
                <button class="btn" id="btn3">Prou G. Rammer</button>
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <!-- TODO: Add free response question here -->
                <h3>What is the name of the Founder of SpaceX?</h3>
                <div id="message2"></div>
                <input id="part2InputId" name="part2Input">
                <button id="part2Btn">Submit</button>
            </div>
        </div>
    </body>

    <script>
        let message = document.getElementById("message");
        let message2 = document.getElementById("message2");
        let input = document.getElementById("part2InputId");

        document.getElementById("btn1").addEventListener("click", function() {
            this.style.backgroundColor = "green";
            message.innerText = "Correct!";
        });

        document.getElementById("btn2").addEventListener("click", function() {
            this.style.backgroundColor = "red";
            message.innerText = "Incorrect";
        });

        document.getElementById("btn3").addEventListener("click", function() {
            this.style.backgroundColor = "red";
            message.innerText = "Incorrect";
        });

        document.getElementById("part2Btn").addEventListener("click", function() {
            let inputVal = input.value;
            if (inputVal === "Elon Musk") {
                input.style.backgroundColor = "green";
                message2.innerText = "Correct";
            } else {
                input.style.backgroundColor = "red";
                message2.innerText = "Incorrect";
            }
        });
    </script>
</html>
