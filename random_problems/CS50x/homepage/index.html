        <script>
            function revealSurprise() {
              const quoteCard = document.querySelector('.quote-card');
              quoteCard.style.background = "linear-gradient(135deg, #1abc9c, #16a085)"; /* Blue-green gradient */
              quoteCard.innerHTML = `
                <h1>"sekai de ichiban ohimesama"</h1>
                <p>- Hatsune Miku</p>
              `;
              quoteCard.classList.add('surprise-animation');
            }
